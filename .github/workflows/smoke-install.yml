name: smoke-install

# Regression guard for the 2026-09-01 P0: `npm i @wave-av/cli` resolved a broken
# `@wave-av/sdk` release (2.1.2) through the `^2.0.11` semver range and every invocation
# died before argv parsing with a module-resolution error. That class of bug — a real,
# already-published dependency drifting a fresh install into a broken combination — only
# shows up when you install the ACTUAL published tarball against the ACTUAL registry, so
# this workflow builds the package, packs it, and installs the tarball into a throwaway
# project exactly the way a real user's `npm install` would. Unit tests and type-check
# cannot catch this: they run against the local, already-linked node_modules tree.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # VER-001 gate. Until now `npm test` ran ONLY in release.yml, which is `on: push: tags: v*` —
  # so the version regression tests in src/cli.test.ts never gated a pull request, and a version
  # drift could only be discovered after a tag was already cut. This job runs them on every PR.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests (includes the VER-001 version-truth gate)
        run: npm test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Fresh install from the packed tarball (real registry, real deps)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          tarball=$(ls "$RUNNER_TEMP"/wave-av-cli-*.tgz | head -n1)
          npm i "$tarball"

      - name: wave --version / --help (module-resolution + VER-001 version-truth smoke)
        run: |
          cd "$RUNNER_TEMP/smoke"

          # VER-001: this step used to run `wave --version` and DISCARD the output, so the
          # installed tarball could print any version at all and still pass. Published 1.0.8
          # printed "1.0.0" exactly like this and shipped. Compare against package.json — this
          # is the end-to-end half of the gate (the unit job covers the source half), and it
          # runs against the real packed tarball as a real user's install would see it.
          EXPECTED=$(node -p "require('$GITHUB_WORKSPACE/package.json').version")
          ACTUAL=$(npx --yes wave --version | tr -d '[:space:]')

          echo "package.json=$EXPECTED  wave --version=$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::VER-001: installed CLI reports '$ACTUAL' but package.json says '$EXPECTED'"
            exit 1
          fi

          # The banner is a second, independent rendering of the version — it disagreed with
          # --version in the shipped 1.0.8 bundle. Assert it carries the same version. The CLI
          # deliberately suppresses the banner under CI/agent env vars, so clear every variable
          # detectEnvironment() keys on (src/lib/environment.ts) — otherwise this check would
          # silently assert against a banner that was never printed, and pass for the wrong
          # reason. Comparing the extracted BANNER for EQUALITY (rather than grepping for a
          # substring) is what makes a missing banner a failure instead of a quiet pass.
          HELP=$(
            unset CI GITHUB_ACTIONS VERCEL BUILDKITE GITLAB_CI CIRCLECI \
                  WAVE_AGENT CLAUDE_CODE CURSOR_SESSION AIDER_SESSION CONTINUE_SESSION
            npx --yes wave --help 2>&1
          )
          BANNER=$(printf '%s' "$HELP" | sed 's/\x1b\[[0-9;]*m//g' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*' | head -n1)
          if [ "$BANNER" != "v$EXPECTED" ]; then
            echo "::error::VER-001: help banner reported '${BANNER:-<no version in banner>}', expected 'v$EXPECTED'"
            printf '%s\n' "$HELP" | head -n 20
            exit 1
          fi
          echo "VER-001: package.json == --version == banner == $EXPECTED"

      - name: wave status / wave doctor (live gateway reachability)
        working-directory: ${{ runner.temp }}/smoke
        env:
          WAVE_GATEWAY_API_KEY: ${{ secrets.WAVE_GATEWAY_API_KEY }}
        run: |
          if [ -z "$WAVE_GATEWAY_API_KEY" ]; then
            echo "skipped: WAVE_GATEWAY_API_KEY absent (fork or unset)"
            exit 0
          fi
          export WAVE_API_KEY="$WAVE_GATEWAY_API_KEY"

          # Pass criteria: the process ran and produced a normal CLI response - a clean
          # exit, or a real HTTP-level auth/scope response (401/402/403 SCOPE_INSUFFICIENT),
          # or the command's own "not authenticated" business-logic exit. Fail criteria: the
          # output looks like the install-time crash class this workflow exists to catch -
          # a module-resolution / ESM-vs-CJS error that means the package never even started.
          run_check() {
            label="$1"
            shift
            set +e
            out=$("$@" 2>&1)
            code=$?
            set -e
            echo "$label exit=$code"
            echo "$out" | head -n 20
            if echo "$out" | grep -qE 'is not defined in ES module scope|Cannot find module|ERR_MODULE_NOT_FOUND|ERR_REQUIRE_ESM|ReferenceError|SyntaxError: Unexpected token|Cannot find package'; then
              echo "::error::$label failed with a module-resolution class error"
              return 1
            fi
            echo "$label: process started and produced a normal CLI response - pass"
            return 0
          }

          run_check "wave doctor" npx --yes wave doctor
          run_check "wave status" npx --yes wave status
