name: (reusable) Release publish — npm OIDC + live-registry verification

# Reusable workflow, called only from release.yml, after _release-verify.yml
# has passed. Split out of release.yml under the repo's file-size gate.
#
# Gate 3 — publish. Auth: npm OIDC trusted publishing (no long-lived token) is
# the intended path. The runner mints a short-lived OIDC identity token
# (id-token: write) and npm (>= 11.5.1) exchanges it for a scoped, single-use
# publish credential -- provided @wave-av/cli has a Trusted Publisher
# configured on npmjs.com (org: wave-av, repo: cli, workflow: release.yml).
# An NPM_TOKEN classic-auth fallback is retained for the window before that
# registration exists; per decision IGV-D-010 (no per-repo publish secrets)
# no such secret is actually configured on this repo, so today this path
# runs OIDC-only. `--provenance` still produces a signed attestation either
# way (both paths hold id-token: write).
#
# Idempotent: if the tag's version is ALREADY on the registry (e.g. this run
# is backfilling a tag that a human already published by hand, or re-running
# after a partial failure), the actual `npm publish` is skipped with a clear
# log line, but this workflow still runs the live-registry verification so a
# backfill run proves the SAME thing a fresh publish would.
#
# Post-publish verification proves the version that just left `publish` is
# actually live and correct on the real registry -- not just that
# `npm publish` returned 0. `verify`'s e2e-smoke installs the packed TARBALL
# before publish; this installs the PUBLISHED package from the real registry
# afterward, catching a publish that reached npm but shipped something other
# than what was tested (stale registry cache, a race with another publish,
# npm mangling the tarball in transit).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  publish:
    name: Publish to npm (gated, idempotent)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # mint the OIDC token npm exchanges for a publish credential
      contents: read
    outputs:
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an older
      # npm (measured: Node v22.14.0 bundles npm 10.9.2 — below the floor, so
      # the OIDC path could never have engaged without this step). Upgrade the
      # CLI on the runner, then PROVE the floor is met rather than assuming the
      # upgrade did what it said. Pinned rather than @latest: this job holds
      # id-token: write, so it should not execute whatever npm publishes next.
      - name: Upgrade npm to a trusted-publishing-capable CLI (>= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          NPM_VER="$(npm --version)"
          echo "npm version: $NPM_VER"
          NPM_VER="$NPM_VER" node -e "
            const raw=process.env.NPM_VER;
            const m=raw.match(/^([0-9]+)\.([0-9]+)\.([0-9]+)/);
            if(!m){console.error('npm version '+raw+' is not a parseable x.y.z - cannot verify trusted-publishing floor');process.exit(1);}
            const cur=[Number(m[1]),Number(m[2]),Number(m[3])], min=[11,5,1];
            for(let i=0;i<3;i++){
              if(cur[i]>min[i]) process.exit(0);
              if(cur[i]<min[i]){console.error('npm '+raw+' < 11.5.1 - trusted publishing unavailable');process.exit(1);}
            }"

      # --ignore-scripts: this job holds id-token: write (a short-lived OIDC
      # publish credential). Dependency lifecycle scripts (preinstall/install/
      # postinstall) are untrusted code paths; running them here would widen
      # the blast radius of a compromised dependency to the OIDC token. The
      # verify job (no id-token permission) already ran a full `npm ci
      # --include=dev` + type-check/test/build/e2e-smoke, so nothing here
      # depends on install-time lifecycle scripts having run.
      - run: npm ci --include=dev --ignore-scripts

      # Build in THIS job, on THIS checkout, immediately before publish.
      # `verify` builds and e2e-smokes on a separate runner/workspace that is
      # not shared with `publish` (GitHub Actions jobs do not share a
      # filesystem) — so without a build here, `npm publish` below would pack
      # whatever happens to be in the working tree, which may be missing
      # `dist/` entirely and would not be the artifact that `verify` proved
      # working.
      - run: npm run build

      # This job builds on its OWN checkout (see comment above), so the dist/
      # scan that runs in _release-verify.yml never sees these bytes. Re-run
      # the same pinned+checksum-verified gitleaks, with the repo's config,
      # over THIS job's build output too — this is the tree `npm publish`
      # actually uploads, and it is otherwise the one build in this whole
      # pipeline that no secret-scan gate ever touches.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz

      - name: gitleaks (secret scan — publish job's own build output)
        run: |
          set -euo pipefail
          if [ -d dist ]; then
            gitleaks detect --no-git --source dist --config .gitleaks.toml --redact --no-banner --exit-code 1
          else
            echo "::warning title=no dist directory::npm run build produced no dist/ - nothing to scan"
          fi

      # inputs.tag/inputs.version come from resolve-tag.sh (release.yml),
      # which already validated the `v[0-9]*` shape — but re-derive and
      # cross-check against package.json here too, from an env var rather
      # than interpolated into the script body.
      - name: Verify tag matches package.json version + choose dist-tag
        id: ver
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_NAME version-from-tag=$TAG_VERSION package.json=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_NAME implies version $TAG_VERSION but package.json is $PKG_VERSION - refusing to publish a mismatched release"
            exit 1
          fi
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          case "$PKG_VERSION" in
            *-*) DIST_TAG=next ;;    # any prerelease (next/rc/beta) - never 'latest'
            *)   DIST_TAG=latest ;;  # stable
          esac
          echo "dist-tag=$DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # Idempotent skip: a backfill run (workflow_dispatch on an existing tag)
      # may target a version a human already published by hand before this
      # pipeline existed. Re-publishing the same version is a hard npm error
      # (npm never allows overwriting a published version), so detect it
      # explicitly and skip with a clear log line rather than failing the run.
      - name: Check whether this version is already on the registry
        id: check
        env:
          PKG_VERSION: ${{ steps.ver.outputs.pkg_version }}
        run: |
          set -euo pipefail
          EXISTING="$(npm view @wave-av/cli@"$PKG_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$EXISTING" = "$PKG_VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@wave-av/cli@$PKG_VERSION is already on the registry — skipping npm publish, proceeding to release"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "@wave-av/cli@$PKG_VERSION not found on the registry — will publish"
          fi

      # Retained fallback. OIDC trusted publishing needs NO config here and is
      # preferred; this only engages when an NPM_TOKEN secret is actually set
      # (none is configured today — IGV-D-010), so that a tag pushed before
      # the npmjs Trusted Publisher registration lands still has a working
      # auth path instead of failing with no recourse. `--provenance` below
      # still produces a signed attestation on this path too (id-token: write
      # is held by this job either way).
      - name: Configure npm auth (NPM_TOKEN fallback only — OIDC needs no config here)
        if: steps.check.outputs.already_published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "npm auth: using NPM_TOKEN secret fallback"
          else
            echo "npm auth: no NPM_TOKEN secret set - relying on OIDC trusted publishing"
          fi

      - name: npm publish (OIDC trusted publishing)
        if: steps.check.outputs.already_published != 'true'
        env:
          DIST_TAG: ${{ steps.ver.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm publish --access public --provenance --tag "$DIST_TAG"

  verify-publish:
    name: Verify published package (live registry)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: npm view — published version is live on the registry
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PUBLISHED=""
          for i in 1 2 3 4 5 6 7 8; do
            PUBLISHED="$(npm view @wave-av/cli@"$EXPECTED" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$EXPECTED" ]; then break; fi
            echo "waiting for the registry to index @wave-av/cli@$EXPECTED (attempt $i)"
            sleep 15
          done
          if [ "$PUBLISHED" != "$EXPECTED" ]; then
            echo "::error::npm view never returned $EXPECTED for @wave-av/cli"
            exit 1
          fi
          echo "npm view: @wave-av/cli@$EXPECTED confirmed live"

      - name: Fresh install from the real registry (not the packed tarball)
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verify"
          echo "SMOKE=$RUNNER_TEMP/verify" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/verify"
          npm init -y >/dev/null
          npm install "@wave-av/cli@$EXPECTED" --registry=https://registry.npmjs.org
          GOT="$(npx --no wave --version)"
          echo "expected=$EXPECTED got=$GOT"
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::published package reports version '$GOT', expected '$EXPECTED'"
            exit 1
          fi

      - name: Default endpoint is api.wave.online, never wave.online
        # `wave status` is unauthenticated in this job (no keychain entry exists on a fresh
        # runner), so it always reports "not authenticated" -- what matters here is which
        # host the published binary targets by default, read back via --output json rather
        # than grepping stdout copy that could change wording without changing behavior.
        run: |
          set -euo pipefail
          cd "$SMOKE"
          # `status` prints a human summary AND a trailing JSON block under --output json; the
          # command's own exit code is non-zero when unauthenticated/unreachable (by design --
          # see cli.test.ts), so this step captures output regardless of exit status and parses
          # only the JSON block (from the first '{' onward), not the whole mixed stream.
          OUT="$(npx --no wave status --output json 2>&1 || true)"
          echo "$OUT"
          ENDPOINT="$(echo "$OUT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const i=d.indexOf('{');try{console.log(JSON.parse(d.slice(i)).apiEndpoint||'')}catch{console.log('')}})")"
          echo "apiEndpoint=$ENDPOINT"
          if [ "$ENDPOINT" != "https://api.wave.online" ]; then
            echo "::error::published package's default apiEndpoint is '$ENDPOINT', expected https://api.wave.online"
            exit 1
          fi
