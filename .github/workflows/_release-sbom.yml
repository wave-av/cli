name: (reusable) Release — generate + attach SPDX SBOM

# Reusable workflow, Gate 5 in the release chain: runs after _release-github-release.yml
# (Gate 4) has created the GitHub Release and attached the packed tarball. Generates an SPDX
# JSON SBOM for that exact tarball asset — syft, installed by downloading its official pinned
# release binary directly and verifying its sha256 against syft's own published checksums.txt
# (no third-party GitHub Action, no installer script executed from the network) — and attaches
# the SBOM to the SAME release as `<tarball-basename>.spdx.json`.
#
# GA criterion SUPPLY-001 (cw issue wave-av/claude-workstation#4803): every published release
# must carry an SBOM asset. Before this workflow, @wave-av/cli releases had none.
#
# Two entry points:
#   - workflow_call (normal path): chained from release.yml as the `sbom:` job, right after
#     `release:`. Receives the tag scripts/release/resolve-tag.sh already validated (format,
#     existence, ancestor-of-main) — this job trusts it and does not re-derive it.
#   - workflow_dispatch (standalone backfill): produces the SBOM for an EXISTING release tag
#     WITHOUT re-running the whole verify+publish+release chain (secret-scan, e2e-smoke, npm
#     OIDC publish) just to attach one missing asset — this is how v1.0.10 is backfilled: it
#     already has a release + tarball, it is just missing the SBOM. `tag` defaults to the
#     latest GitHub Release when left empty.
#
# If a tag has NO GitHub Release at all yet (e.g. v1.0.9, which was never released), this job
# deliberately does NOT fabricate one — it fails loud with the exact command to run instead:
# `gh workflow run release.yml -f tag=<tag>`. That (idempotently) creates the release + packs
# the tarball, and this job now runs immediately after it in that same chain, so the backfilled
# release gets its SBOM in the same run.
#
# Idempotent: `gh release upload --clobber` makes re-running this for a tag that already has an
# SBOM asset a safe no-op-that-refreshes, never a failure — same idempotency contract as
# _release-github-release.yml's tarball upload.
#
# Provenance note (updated for the SUPPLY-001 fix below): this job still downloads and verifies
# the tarball ALREADY ATTACHED to the release (the exact packed artifact a consumer downloads),
# but it does NOT scan that bare extracted tarball with syft — the packed tarball intentionally
# omits package-lock.json/node_modules (see package.json `files`), so scanning it alone can never
# surface a resolvable dependency graph. Instead: check out the SAME tagged commit (`ref:` below),
# `npm ci` its pinned package-lock.json to materialize the real production node_modules tree, and
# scan THAT with syft. This describes the exact dependency set that ships with the tarball
# (resolved via the tagged commit's own lockfile) rather than the tarball's bytes directly. The
# tarball download/verification step is kept for two reasons: (1) it fails loud if the release
# job never packed a tarball for this tag, and (2) its filename is reused for the SBOM's own
# output filename (`<tarball-basename>.spdx.json`), preserving the existing naming convention.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach an SBOM to (e.g. v1.0.10). Leave empty to use the latest GitHub Release.'
        required: false
        type: string

# Serializes with the release-tag scoped runs of both entry points to shrink the window where a
# standalone workflow_dispatch could download the tarball while _release-github-release.yml is
# mid-re-upload. Same group-key convention release.yml itself uses for a workflow_dispatch run
# (`cli-release-<tag>`), so a dispatch-triggered backfill of either workflow for the same tag
# queues rather than races. `gh release upload --clobber` is idempotent on both sides regardless,
# so any residual race (e.g. against a push-tag-triggered release.yml run, whose own group key is
# ref-based, not tag-based) is self-healing on the next run, never a permanent inconsistency.
concurrency:
  group: cli-release-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate + attach SPDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve tag (workflow_call passes it pre-validated; workflow_dispatch defaults to latest release)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CALL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$CALL_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
            echo "no tag input — defaulting to latest release: $TAG"
          fi
          # Full-anchored regex, not a glob — same shape resolve-tag.sh enforces upstream.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            # A workflow_dispatch string input can contain embedded newlines; interpolating it
            # raw into a `::error::` line would let a line starting with `::` after one of those
            # newlines be parsed as an unrelated workflow command. Strip newlines and keep the
            # untrusted value off the `::error::` line entirely (constant message there; the raw
            # value goes out on its own plain, non-`::`-prefixed line).
            SAFE_TAG="$(printf '%s' "$TAG" | tr -d '\n\r')"
            echo "::error::sbom: tag input does not match the required vX.Y.Z[-suffix] pattern"
            printf 'sbom: rejected tag value (newlines stripped): %s\n' "$SAFE_TAG"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::sbom: no GitHub Release found for tag '$TAG'. This job attaches an SBOM to an EXISTING release; it does not create one. Run 'gh workflow run release.yml -f tag=$TAG' first — it (idempotently) creates the release + tarball, and this job then runs right after it in that same chain."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Validate tag trust (exists, is an ancestor of origin/main)
        # workflow_call already receives a tag scripts/release/resolve-tag.sh validated this same
        # way; this re-checks unconditionally (cheap, and uniform across both entry points) so the
        # workflow_dispatch path can't be pointed at a release whose tag/commit was never verified
        # to have actually merged to main (e.g. a release created by hand, out of band, pointing at
        # an unmerged or force-pushed-away commit) — flagged by review as allowing an SBOM for an
        # "unreviewed or unrelated tag" on the dispatch path.
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! SHA="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}")"; then
            echo "::error::sbom: tag '$TAG' does not exist in this repository (or does not point at a commit)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::sbom: tag '$TAG' (commit $SHA) is not reachable from origin/main -- refusing to attach an SBOM to a release for an unmerged or unrecognized ref"
            exit 1
          fi
          echo "tag '$TAG' verified: exists, ancestor of origin/main ($SHA)"

      - name: Download the release's packed tarball asset
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sbom" "$RUNNER_TEMP/sbom/extracted"
          gh release download "$TAG" --repo "$REPO" --pattern '*.tgz' --dir "$RUNNER_TEMP/sbom" --clobber
          TARBALL_COUNT="$(find "$RUNNER_TEMP/sbom" -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "$TARBALL_COUNT" -eq 0 ]; then
            echo "::error::sbom: release '$TAG' has no .tgz asset — the release job (_release-github-release.yml) must pack + attach the tarball before this job can scan it"
            exit 1
          fi
          if [ "$TARBALL_COUNT" -gt 1 ]; then
            echo "::error::sbom: expected exactly one .tgz asset on release '$TAG', found $TARBALL_COUNT — refusing to guess which one to scan"
            exit 1
          fi
          TARBALL="$(find "$RUNNER_TEMP/sbom" -maxdepth 1 -name '*.tgz')"
          BASENAME="$(basename "$TARBALL" .tgz)"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/sbom/extracted"
          EXTRACTED="$RUNNER_TEMP/sbom/extracted/package"
          # The tag's version is what the SBOM will be labeled with — verify the tarball actually
          # IS that version, so a stale or manually-uploaded/mismatched tarball asset fails loud
          # instead of silently producing an SBOM that claims the wrong version.
          PKG_VERSION="$(jq -r '.version' "$EXTRACTED/package.json")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::sbom: tarball's package.json version '$PKG_VERSION' does not match tag '$TAG' (expected version '$VERSION') — refusing to attach a version-mismatched SBOM"
            exit 1
          fi
          echo "basename=$BASENAME" >> "$GITHUB_OUTPUT"
          echo "extracted=$EXTRACTED" >> "$GITHUB_OUTPUT"

      # SUPPLY-001 fix (root cause): the packed tarball extracted above deliberately does NOT
      # include package-lock.json or node_modules (npm's "files" allowlist in package.json only
      # ships dist/templates/README/CHANGELOG/LICENSE/NOTICE) — so a syft scan of the extracted
      # tarball alone can only ever see the single root "@wave-av/cli" package-directory entry,
      # never the ~12 real runtime packages (chalk, commander, zod, ws, ...) declared in
      # package.json `dependencies`. Measured on the live v1.0.10 SBOM: exactly 1 packages[]
      # entry, the self-describing root directory, zero resolvable dependency packages.
      # Fix: install the EXACT locked dependency tree from package-lock.json (already in git at
      # this tagged commit, via the `ref:` checkout above) with `npm ci`, so syft has a real
      # node_modules to catalog. `--omit=dev` matches what actually ships (production deps only,
      # same set the tarball's consumers get transitively via npm install); `--ignore-scripts`
      # keeps an SBOM-generation job (contents:write) from ever executing arbitrary lifecycle
      # scripts pulled from the registry.
      - name: Install production dependencies (npm ci, from the tagged commit's pinned lockfile)
        run: npm ci --omit=dev --ignore-scripts

      - name: Install syft (pinned release binary, checksum-verified — no installer script)
        # Deliberately NOT anchore/sbom-action/download-syft here: that sub-action fetches
        # syft's install.sh from a git TAG ref (raw.githubusercontent.com/anchore/syft/<tag>/
        # install.sh) and executes it — a tag is a mutable ref, and executing a fetched shell
        # script is more surface than this job needs. Instead: download syft's official release
        # tarball for a PINNED version straight from its immutable GitHub Release asset URL, and
        # verify its sha256 against that same release's published checksums.txt before ever
        # executing the binary. No shell script from the network is ever run.
        id: syft
        env:
          SYFT_VERSION: "1.51.1"
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/syft-install"
          mkdir -p "$WORKDIR"
          BASE="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          TARBALL="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$WORKDIR/$TARBALL" "$BASE/$TARBALL"
          curl -sSfL -o "$WORKDIR/checksums.txt" "$BASE/syft_${SYFT_VERSION}_checksums.txt"
          EXPECTED="$(grep " ${TARBALL}\$" "$WORKDIR/checksums.txt" | awk '{print $1}')"
          if [ -z "$EXPECTED" ]; then
            echo "::error::sbom: no checksum entry for $TARBALL in syft's published checksums.txt"
            exit 1
          fi
          ACTUAL="$(sha256sum "$WORKDIR/$TARBALL" | awk '{print $1}')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::sbom: syft tarball checksum mismatch — expected $EXPECTED, got $ACTUAL. Refusing to execute an unverified binary."
            exit 1
          fi
          echo "checksum verified: $TARBALL ($ACTUAL)"
          tar -xzf "$WORKDIR/$TARBALL" -C "$WORKDIR" syft
          chmod +x "$WORKDIR/syft"
          echo "cmd=$WORKDIR/syft" >> "$GITHUB_OUTPUT"

      # Scans $GITHUB_WORKSPACE (the tagged-commit checkout, now with node_modules populated by
      # `npm ci --omit=dev` above) instead of the bare extracted tarball -- this is the tree that
      # actually has a resolvable dependency graph for syft's npm/node cataloger to walk.
      - name: Generate SPDX SBOM for the installed production dependency tree
        id: gen
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          SRC: ${{ github.workspace }}
          PKG_NAME: "@wave-av/cli"
          VERSION: ${{ steps.resolve.outputs.version }}
          OUT: ${{ steps.download.outputs.basename }}.spdx.json
        run: |
          set -euo pipefail
          "$SYFT_CMD" "dir:$SRC" --source-name "$PKG_NAME" --source-version "$VERSION" -o "spdx-json=$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      # Fail-closed floor (SUPPLY-001 hardening): the old check only required `packages[] >= 1`,
      # which the empty-dependency bug above satisfied trivially (the single self-describing root
      # directory entry IS one package). The floor here is derived from the lockfile itself, not a
      # hardcoded number, so it stays correct as dependencies are added/removed: count the direct
      # runtime dependencies pinned in package-lock.json's root package (`packages[""].dependencies`,
      # lockfileVersion >= 2/3 format) and require at least that many SBOM packages[] entries that
      # carry a real `versionInfo` (i.e. actually-resolved packages, not placeholder/NOASSERTION
      # entries). This makes a regression back to "syft ran on an uninstalled tree" fail the job
      # instead of silently shipping an empty-looking SBOM again.
      - name: Validate SBOM (non-empty, has packages[], meets the lockfile-derived dependency floor)
        env:
          SBOM_FILE: ${{ steps.gen.outputs.out }}
        run: |
          set -euo pipefail
          if [ ! -s "$SBOM_FILE" ]; then
            echo "::error::sbom: $SBOM_FILE is missing or empty"
            exit 1
          fi
          COUNT=$(jq '(.packages // []) | length' "$SBOM_FILE")
          echo "SPDX packages[]: $COUNT entries"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::sbom: $SBOM_FILE has an empty packages[] array"
            exit 1
          fi

          WITH_VERSION=$(jq '[(.packages // [])[] | select(.versionInfo != null and .versionInfo != "" and .versionInfo != "NOASSERTION")] | length' "$SBOM_FILE")
          FLOOR=$(jq '(.packages[""].dependencies // {}) | keys | length' package-lock.json)
          echo "SPDX packages[] with a real versionInfo: $WITH_VERSION (lockfile direct-runtime-dependency floor: $FLOOR)"
          if [ "$FLOOR" -lt 1 ]; then
            echo "::error::sbom: could not derive a dependency floor from package-lock.json (packages[\"\"].dependencies was empty/missing) -- refusing to validate against a floor of 0"
            exit 1
          fi
          if [ "$WITH_VERSION" -lt "$FLOOR" ]; then
            echo "::error::sbom: $SBOM_FILE has only $WITH_VERSION versioned package(s), below the lockfile-derived floor of $FLOOR direct runtime dependencies -- syft likely scanned an uninstalled tree (SUPPLY-001 regression)"
            exit 1
          fi

      - name: Upload SBOM to the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SBOM_FILE: ${{ steps.gen.outputs.out }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$SBOM_FILE" --repo "$REPO" --clobber
          echo "attached $SBOM_FILE to release $TAG"
