name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          BOT_ISSUE_OPS_APP_ID: ${{ secrets.BOT_ISSUE_OPS_APP_ID }}
          BOT_ISSUE_OPS_PRIVATE_KEY: ${{ secrets.BOT_ISSUE_OPS_PRIVATE_KEY }}
          ISSUE_OPS_PAT: ${{ secrets.ISSUE_OPS_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          WAVE_GATEWAY_API_KEY: ${{ secrets.WAVE_GATEWAY_API_KEY }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add BOT_ISSUE_OPS_APP_ID="$BOT_ISSUE_OPS_APP_ID" BOT_ISSUE_OPS_PRIVATE_KEY="$BOT_ISSUE_OPS_PRIVATE_KEY" ISSUE_OPS_PAT="$ISSUE_OPS_PAT" NPM_TOKEN="$NPM_TOKEN" WAVE_GATEWAY_API_KEY="$WAVE_GATEWAY_API_KEY" --repo wave-av/cli
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          GUARD_PRIVATE_REPOS: ${{ vars.GUARD_PRIVATE_REPOS }}
          IO_OWNER: ${{ vars.IO_OWNER }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add GUARD_PRIVATE_REPOS="$GUARD_PRIVATE_REPOS" IO_OWNER="$IO_OWNER" --repo wave-av/cli
  cleanup:
    needs: [secrets, variables]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
