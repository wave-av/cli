# @wave-av/cli CI on Buildkite. See .buildkite/README.md.
#
# Uploaded by the pipeline's one settings step, which runs .buildkite/scripts/upload.sh
# (buildkite-agent pipeline upload --no-interpolation --reject-parse-warnings).
#
# Every step: one checked-in script as its command (agents run with no-command-eval), an explicit
# timeout, automatic retry only when the agent or guest is lost (-1, 255; limit 1 each), no plugins,
# and no secret values in env. Each step runs in its own fresh guest.
#
# Ordering is load-bearing. The two leak guards run first, each followed by a `wait` barrier, so
# every later step depends on both guards. Do not remove a barrier or move a step above one.
#
# Secrets: none, on any build. This is a public repository, and the CI host injects no value into
# its builds (a standing decision). So the private-repo rule does not apply here by design:
# guard-content-policy runs on every non-pull-request build, guard-content-policy-pr on pull
# requests. governance-enforce is not a step here: its enforcer package is private and cannot be
# installed without a registry token (README "Not in this pipeline"). Do not add a step that needs
# a host-injected value.
#
# Queue: fpc-isolated for every step.

agents:
  queue: fpc-isolated

env:
  CI: "true"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

steps:
  - label: ":key: guard gitleaks"
    key: guard-gitleaks
    command: .buildkite/scripts/guard-gitleaks.sh
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - wait

  - label: ":clipboard: guard content-policy"
    key: guard-content-policy
    command: .buildkite/scripts/guard-content-policy.sh
    if: build.pull_request.id == null
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":clipboard: guard content-policy (pull request, no private-repo list)"
    key: guard-content-policy-pr
    command: .buildkite/scripts/guard-content-policy.sh
    if: build.pull_request.id != null
    env:
      WAVE_JOB_GUARD_PR: "1"
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - wait

  - label: ":typescript: type-check + build + unit tests"
    key: unit
    command: .buildkite/scripts/unit.sh
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":package: pack + fresh install smoke (version truth)"
    key: smoke
    command: .buildkite/scripts/smoke.sh
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":page_facing_up: license truth (offline)"
    key: license-truth
    command: .buildkite/scripts/license-truth.sh
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":mag: foundation secret-scan"
    key: foundation-secret-scan
    command: .buildkite/scripts/foundation-secret-scan.sh
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":straight_ruler: foundation file-size gate"
    key: foundation-file-size
    command: .buildkite/scripts/foundation-file-size.sh
    timeout_in_minutes: 10
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":scroll: foundation skill-validate"
    key: foundation-skill-validate
    command: .buildkite/scripts/foundation-skill-validate.sh
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false

  - label: ":globe_with_meridians: foundation verify-routes"
    key: foundation-verify-routes
    command: .buildkite/scripts/foundation-verify-routes.sh
    timeout_in_minutes: 5
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
      manual:
        allowed: true
        permit_on_passed: false
